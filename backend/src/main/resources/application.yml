server:
  port: 8080

spring:
  application:
    name: lab-selection

  # ------------------------------------------------------------
  # 本机专属配置放在 application-local.yml 里（数据库密码、JWT 密钥）。
  # 该文件已被 .gitignore 排除，每人自己建一份：
  #   复制 application-local.yml.example → application-local.yml，填自己的值
  # 加 optional: 前缀表示"没有这个文件也能启动"，
  # 这样室友没配时是先报连不上数据库，而不是直接启动失败。
  # ------------------------------------------------------------
  config:
    import: optional:classpath:application-local.yml

  datasource:
    # 库名必须是 lab_selection（见 framework/3.database/schema.sql）
    url: jdbc:mysql://localhost:3306/lab_selection?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 账号密码属于本机配置，写在 application-local.yml 里覆盖
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.college.selection.entity
  configuration:
    # 数据库 snake_case → Java camelCase，必须开
    map-underscore-to-camel-case: true

logging:
  level:
    com.college.selection: debug

selection:
  jwt:
    # secret 属于本机配置，写在 application-local.yml 里
    expire-seconds: 7200
